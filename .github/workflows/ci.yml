name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint-type-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest --cov=cefomena --cov-report=term --cov-report=xml
      - name: CLI smoke (synth → tokenizer → train → export → checksums)
        run: |
          set -euo pipefail
          D=$(mktemp -d)
          uv run cefomena synth --n 300 --out $D/s.jsonl
          uv run cefomena train-tokenizer --data $D/s.jsonl --vocab-size 400 --out $D/tok.json
          uv run cefomena prepare --data $D/s.jsonl --tokenizer $D/tok.json --out $D/d.npz
          uv run cefomena train --data $D/d.npz --tokenizer $D/tok.json --preset test \
            --steps 30 --batch-size 8 --context 64 --device cpu --active-steps 20 --out $D/model
          (cd $D/model && sha256sum -c SHA256SUMS)
