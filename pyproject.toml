[project]
name = "cefomena"
version = "0.1.0"
description = "Modelo conversacional ligero (español) con arquitectura híbrida bioinspirada y orquestador de agente."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jessbludev" }]
requires-python = ">=3.11"
keywords = ["language-model", "bio-inspired", "agent", "safetensors", "spanish"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Spanish",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4.3",
    "torch>=2.3",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.24"]
space = ["gradio>=4.44", "huggingface_hub>=0.24"]

[project.scripts]
cefomena = "cefomena.cli:main"

[project.urls]
Repository = "https://github.com/Jessbludev/Neural-CEFOMENA"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/cefomena/train/synth.py" = ["E501"]
"notebooks/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/cefomena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
